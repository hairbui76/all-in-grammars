<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f4">
<meta name="description" content="Học ngữ pháp tiếng Anh: 296 bài theo 24 chuyên đề, kèm flashcard và quiz. Tiến độ lưu ngay trên máy bạn.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231f7a55'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Georgia,serif' font-size='20' font-weight='700' fill='%23fff'%3EG%3C/text%3E%3C/svg%3E">
<title>All in Grammars</title>
<script>
// set the theme before first paint
try {
  var t = (JSON.parse(localStorage.getItem('engram-v1')) || {}).theme;
  if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
} catch (e) {}

// A phone sometimes lays the page out at desktop width (about 980px) and shrinks it to fit,
// e.g. with "Desktop site" switched on, which leaves the phone layout unreadably small.
// Scale it back up so one CSS pixel matches the real screen again.
//
// A wrong guess here would blow the page up on a healthy phone, so the test is strict: besides the
// width mismatch, the browser must actually be showing the page zoomed out. Sizes that are briefly
// out of step, as in the middle of a rotation, never do that.
(function () {
  var root = document.documentElement;
  var fitted = null; // {w, landscape} the zoom was computed for, or null while not zoomed

  function isLandscape() {
    return matchMedia('(orientation: landscape)').matches;
  }
  // Zoom factor the page needs, or 0. Only meaningful while the page is not zoomed.
  function needed() {
    // iOS keeps screen.width as the portrait width whichever way the phone is held
    var screenW = isLandscape() ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
    var w = window.innerWidth;
    var vv = window.visualViewport;
    var touch = navigator.maxTouchPoints > 0 || 'ontouchstart' in window || matchMedia('(pointer: coarse)').matches;
    var shrunk = !!vv && vv.scale < 0.9;
    return touch && shrunk && screenW >= 240 && screenW < 700 && w < 1000 && w > screenW * 1.25 ? w / screenW : 0;
  }
  function apply() {
    var z = needed();
    root.style.zoom = z || '';
    root.classList.toggle('fit', !!z);
    fitted = z ? { w: window.innerWidth, landscape: isLandscape() } : null;
  }
  function check() {
    if (!fitted) return apply();
    // zoomed already: the address bar or keyboard resizing the window changes nothing
    if (fitted.w === window.innerWidth && fitted.landscape === isLandscape()) return;
    // the layout changed: measure again from the unzoomed state
    root.style.zoom = '';
    root.classList.remove('fit');
    fitted = null;
    requestAnimationFrame(function () {
      requestAnimationFrame(apply);
    });
  }
  var timer;
  function later() {
    clearTimeout(timer);
    timer = setTimeout(check, 250);
  }
  check();
  addEventListener('DOMContentLoaded', check);
  addEventListener('load', later);
  addEventListener('resize', later);
})();
</script>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Điều hướng"></aside>
  <div class="col">
    <header class="topbar" id="topbar"></header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Điều hướng chính"></nav>

<noscript><p style="padding:20px">Trang này cần bật JavaScript.</p></noscript>
<script type="module" src="/src/main.js"></script>
</body>
</html>
