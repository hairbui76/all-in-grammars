<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b4332">
<meta name="description" content="Học ngữ pháp tiếng Anh: 296 bài theo 24 chuyên đề, kèm flashcard và quiz. Tiến độ lưu ngay trên máy bạn.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232d6a4f'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Georgia,serif' font-size='18' font-weight='700' fill='%23fff'%3EG%3C/text%3E%3C/svg%3E">
<title>Học Ngữ pháp Tiếng Anh</title>
<script>
// set the theme before first paint
try {
  var t = (JSON.parse(localStorage.getItem('engram-v1')) || {}).theme;
  if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
} catch (e) {}
</script>
</head>
<body>

<header class="bar">
  <button class="ib menu" id="mBtn" aria-label="Danh sách chuyên đề" aria-controls="side" aria-expanded="false">
    <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <a class="ib" href="#/" aria-label="Trang chủ">
    <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
  </a>
  <h1 id="title">Học Ngữ pháp Tiếng Anh</h1>
  <a class="ib" href="#/search" aria-label="Tìm kiếm">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  </a>
  <button class="ib" id="tBtn" aria-label="Đổi giao diện sáng/tối">
    <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
  </button>
</header>

<div class="scrim" id="scrim"></div>
<div class="wrap">
  <nav class="side" id="side" aria-label="Chuyên đề"></nav>
  <main class="main" id="main"></main>
</div>

<div class="fab" id="fab"></div>
<noscript><p style="padding:20px">Trang này cần bật JavaScript.</p></noscript>
<script type="module" src="/src/main.js"></script>
</body>
</html>
